<main class="hero-center">
  <div class="glitch-container">
    <h1 class="glitch" data-text="ETABLIR LA CONNEXION">ETABLIR LA CONNEXION</h1>
  </div>

  <div class="contact-container">
    <div class="contact-info">
      <a href="https://www.linkedin.com/in/josias-salou-6380a0273/" target="_blank" class="cyber-card contact-link-card">
        <h3>📍 LinkedIn</h3>
        <p>josias-salou-6380a0273</p>
        <span class="status-line">Ouvrir le profil →</span>
      </a>

      <a href="https://github.com/Saloujosias" target="_blank" class="cyber-card contact-link-card">
        <h3>💻 GitHub</h3>
        <p>@Saloujosias</p>
        <span class="status-line">Voir les dépôts →</span>
      </a>
      
      <div class="cyber-card">
        <h3>🌍 Localisation</h3>
        <p>Angers // Campus ESAIP</p>
      </div>
    </div>

    <section class="contact-form-section">
      <form action="#" method="POST" class="cyber-form">
        <div class="form-group">
          <label for="name">ID_UTILISATEUR</label>
          <input type="text" id="name" name="name" placeholder="Votre nom ou entreprise..." required>
        </div>
        
        <div class="form-group">
          <label for="email">ADRESSE_MAIL</label>
          <input type="email" id="email" name="email" placeholder="nom@domaine.com" required>
        </div>

        <div class="form-group">
          <label for="message">MESSAGE_ENCRYPTÉ</label>
          <textarea id="message" name="message" rows="5" placeholder="Initialisation du flux de données..." required></textarea>
        </div>

        <button type="submit" class="cyber-button">
          <span class="dot pulse"></span> ENVOYER_PAQUET
        </button>
      </form>
    </section>
  </div>
</main>

<footer class="footer-minimal">
  <div class="social-links">
